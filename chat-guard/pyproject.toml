[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-chat-guard"
version = "0.1.0"
description = "Chat moderator for a private family Bedrock server: blocks swearing, personal info, links and private messages, mutes repeat offenders, logs chat and alerts the host."
requires-python = ">=3.10"
license = { text = "MIT" }

[project.entry-points."endstone"]
chat-guard = "endstone_chat_guard:ChatGuard"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_chat_guard"]
